<style>
  :root { color-scheme: light dark; }
  body { max-width: 62em; margin: 2rem auto; padding: 0 1.2rem;
         font: 16px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         color: #24292f; background: #fff; }
  h1, h2, h3 { border-bottom: 1px solid #eaecef; padding-bottom: .3em; margin-top: 1.6em; }
  h1 { font-size: 1.9em; } h2 { font-size: 1.45em; } h3 { font-size: 1.15em; }
  table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid #d0d7de; padding: 6px 10px; vertical-align: top; }
  th { background: #f6f8fa; text-align: left; }
  tr:nth-child(even) td { background: #fbfcfd; }
  code { background: #f6f8fa; padding: 2px 5px; border-radius: 4px;
         font-size: 92%; word-break: break-word; }
  pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 4px solid #d0d7de; margin: 0; padding: 0 1em; color: #57606a; }
  #TOC { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px;
         padding: .8em 1.2em; margin-bottom: 2em; }
  #TOC ul { margin: .3em 0; } a { color: #0969da; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    h1, h2, h3 { border-color: #30363d; }
    th, td { border-color: #30363d; } th { background: #161b22; }
    tr:nth-child(even) td { background: #11161d; }
    code, pre, #TOC { background: #161b22; } #TOC { border-color: #30363d; }
    blockquote { border-color: #30363d; color: #9198a1; } a { color: #4493f8; }
  }
</style>
